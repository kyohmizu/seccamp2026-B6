# 課題1 の可視性を安全に確認するための隔離ビルド。
# frontend-deps を「デフォルト」と「--foreground-scripts」の2ステップで実行し、
# postinstall 出力がログに出るかを1回のビルドで比較する。イメージ push・deploy は行わない。
#
# 実行例（リポジトリルート = frontend/ を含むディレクトリから実行）:
#   gcloud builds submit \
#     --config chapter3/exercises/solutions/10-runtime-protection/cloudbuild.demo.yaml \
#     --substitutions=_NPM_REGISTRY=http://<verdaccio-ip>:4873/ \
#     --project $PROJECT --region asia-northeast1 .
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _NPM_REGISTRY: ''   # 悪性版 expense-format@1.0.1 を配信するレジストリ（1-3 の攻撃デモの Verdaccio）
steps:
  - id: frontend-deps-DEFAULT
    name: node:22-slim
    entrypoint: bash
    args:
      - -c
      - |
        cd frontend
        echo "node=$(node -v) npm=$(npm -v)"
        printf 'registry=%s\n' "${_NPM_REGISTRY}" > .npmrc
        rm -f package-lock.json
        echo "===== [DEFAULT] npm install（--foreground-scripts なし）====="
        npm install --omit=dev --no-audit --no-fund
        echo "----- installed expense-format version -----"
        node -p "require('./node_modules/expense-format/package.json').version"
  - id: frontend-deps-FOREGROUND
    name: node:22-slim
    entrypoint: bash
    args:
      - -c
      - |
        cd frontend
        rm -rf node_modules package-lock.json
        printf 'registry=%s\n' "${_NPM_REGISTRY}" > .npmrc
        echo "===== [FOREGROUND] npm install --foreground-scripts ====="
        npm install --omit=dev --no-audit --no-fund --foreground-scripts
