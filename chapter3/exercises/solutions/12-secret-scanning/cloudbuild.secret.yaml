# 解答: パイプラインに Trivy の secret スキャンを組み込む。
# ソース（fs）とビルド済みイメージ（image）の両方を検査する。
# まずは --exit-code 0（レポートのみ・ビルドは落とさない）。
# 品質ゲート化する場合は --exit-code 1 に変える（検出でビルドを停止）。
substitutions:
  _REGION: asia-northeast1
  _REPO: flowpay
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  # ソースの secret スキャン（作業ツリー全体）。レジストリ認証不要。
  - id: secret-scan-source
    name: aquasec/trivy
    args: ['fs', '--scanners', 'secret', '--exit-code', '0', '.']

  # Trivy が AR からイメージを pull するための docker 認証（ビルド SA のトークン）
  - id: auth
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        mkdir -p /workspace/.docker
        TOKEN=$$(gcloud auth print-access-token)
        AUTH=$$(printf 'oauth2accesstoken:%s' "$$TOKEN" | base64 -w0)
        printf '{"auths":{"%s-docker.pkg.dev":{"auth":"%s"}}}' "${_REGION}" "$$AUTH" > /workspace/.docker/config.json

  # イメージの secret スキャン（成果物への焼き込みを検出）
  - id: secret-scan-image-frontend
    name: aquasec/trivy
    env: ['DOCKER_CONFIG=/workspace/.docker']
    args: ['image', '--scanners', 'secret', '--exit-code', '0', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:latest']
  - id: secret-scan-image-backend
    name: aquasec/trivy
    env: ['DOCKER_CONFIG=/workspace/.docker']
    args: ['image', '--scanners', 'secret', '--exit-code', '0', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest']
